name: nddev-security-bundle

# One private-fleet placement for four fast security gates in a private
# repository with GitHub Code Security. zizmor retains SARIF upload while the
# previously paid four independent cold-start and queue costs. The workflow
# source is fetched at job.workflow_sha, so its companion script is exactly the
# same immutable revision as this called workflow.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Private Linux X64 runner label.'
        type: string
        default: 'nddev-linux-standard'
      gitleaks_config_path:
        description: 'Optional repository-relative .gitleaks.toml path.'
        type: string
        default: ''
      zizmor_target:
        description: 'Repository-relative path analyzed by zizmor.'
        type: string
        default: '.'
      osv_lockfile:
        description: 'Optional repository-relative lockfile; empty scans the repository recursively.'
        type: string
        default: ''

permissions: {}

jobs:
  security-bundle:
    name: actionlint + zizmor + OSV + gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      actions: read           # upload-sarif reads this workflow run
      contents: read          # scan the caller checkout
      security-events: write  # publish zizmor SARIF to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Validate runner and called-workflow identity
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          BUNDLE_RUNNER_OS: ${{ runner.os }}
          BUNDLE_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = NDDev-OpenNetwork/ci-workflows
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BUNDLE_RUNNER_OS" = Linux
          test "$BUNDLE_RUNNER_ARCH" = X64

      - name: Isolate global Git config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          isolated_config="$RUNNER_TEMP/nddev-ci-global.gitconfig"
          : > "$isolated_config"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$isolated_config" >> "$GITHUB_ENV"

      - name: Checkout caller with full ref history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact called-workflow implementation
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          # The fetch goes out with the job's own token, the way actions/checkout
          # does it (basic auth, user x-access-token). The repository is public
          # and the token adds no access; it adds an identity. GitHub throttles
          # anonymous git per source address, and the fleet's runners share four
          # addresses: under a burst on 2026-09-02 (09:25Z-09:40Z, again at
          # 10:02Z) anonymous fetches answered 401 -- surfacing as "could not
          # read Username for 'https://github.com'" and "expected flush after
          # ref listing" -- while the same fetch with a token went through. The
          # earlier reading of that failure as a protocol-v2 problem was wrong:
          # the retry below is kept as a belt, the token is the fix.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/nddev-security-bundle-source"
          git init --quiet "$source_root"
          git -C "$source_root" remote add origin \
            "https://github.com/${WORKFLOW_REPOSITORY}.git"
          authorization="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          fetch_called_workflow() {
            local attempt
            for attempt in 1 2 3; do
              if git -C "$source_root" \
                -c "http.https://github.com/.extraheader=${authorization}" \
                fetch --quiet --depth=1 origin "$WORKFLOW_SHA"; then
                return 0
              fi
              printf 'called-workflow fetch attempt %s failed\n' "$attempt" >&2
              sleep "$attempt"
            done
            return 1
          }
          fetch_called_workflow
          git -C "$source_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$WORKFLOW_SHA"
          printf 'NDDEV_SECURITY_BUNDLE_SCRIPT=%s\n' \
            "$source_root/scripts/run_private_security_bundle.sh" >> "$GITHUB_ENV"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: 0.11.30
          enable-cache: false

      - name: Run consolidated security gates
        id: scan
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks_config_path }}
          ZIZMOR_TARGET: ${{ inputs.zizmor_target }}
          OSV_LOCKFILE: ${{ inputs.osv_lockfile }}
          ZIZMOR_SARIF_PATH: ${{ runner.temp }}/private-security-zizmor.sarif
          OSV_SARIF_PATH: ${{ runner.temp }}/private-security-osv.sarif
          GITLEAKS_SARIF_PATH: ${{ runner.temp }}/private-security-gitleaks.sarif
          ACTIONLINT_LOG_PATH: ${{ runner.temp }}/private-security-actionlint.log
        run: "$NDDEV_SECURITY_BUNDLE_SCRIPT"

      - name: Upload redacted security evidence
        # Only when the gates actually ran. These uploads were `always()`, so a
        # job that died in its own bootstrap -- before any scanner existed --
        # ended by reporting `Path does not exist:
        # .../private-security-zizmor.sarif`. That is a true statement about a
        # file and a false statement about the run: the real failure was three
        # steps earlier, and the message that reached the reviewer named the
        # wrong thing entirely. Evidence is still uploaded when the scan runs
        # and finds problems, which is the case `always()` was there for.
        if: ${{ !cancelled() && steps.scan.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nddev-private-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-security-actionlint.log
            ${{ runner.temp }}/private-security-zizmor.sarif
            ${{ runner.temp }}/private-security-osv.sarif
            ${{ runner.temp }}/private-security-gitleaks.sarif
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Upload zizmor SARIF
        if: ${{ !cancelled() && steps.scan.conclusion != 'skipped' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: ${{ runner.temp }}/private-security-zizmor.sarif
          category: zizmor

      - name: Enforce consolidated security gates
        if: ${{ steps.scan.outcome == 'failure' }}
        shell: bash
        run: exit 1
