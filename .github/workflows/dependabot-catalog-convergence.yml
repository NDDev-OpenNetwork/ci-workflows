name: dependabot-catalog-convergence

on:
  # `workflow_run` supplies a default-branch workflow and write token. This job
  # accepts only a failed same-repository PR run by dependabot[bot], never
  # executes candidate files, and runs the synchronizer from a separate trusted
  # default-branch checkout. The candidate is only a Git output worktree.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-catalog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the derived catalog commit to the same Dependabot branch
      pull-requests: read # bind workflow_run metadata to the existing PR
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout trusted generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - name: Checkout Dependabot branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: true
          path: candidate
      - name: Synchronize derived action declarations
        run: python3 -I trusted/scripts/sync_action_catalog.py --root candidate
      - name: Commit converged declarations
        working-directory: candidate
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows catalog docs/generated; then
            echo "catalog already converged"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/workflows catalog docs/generated
            git commit -m "chore(deps): synchronize action catalog"
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
