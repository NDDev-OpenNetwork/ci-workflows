name: actionlint

# Reusable actionlint (checksum-verified binary) for BOTH tiers.
# Lints workflow YAML for syntax errors, expression typos, and deprecated usage.
#
# Runner contract: Linux X64 only. The workflow downloads the upstream
# linux_amd64 tarball, verifies it with sha256sum, and installs into
# /usr/local/bin, so any other OS/architecture is rejected by an explicit
# guard before the download instead of failing half-way through.
#
# tool_source picks where the binaries come from: 'download' is the verified
# tarball above, 'image' is the surface a fleet image already bakes (versions
# are reported, the image build chain is the trust root), and 'auto' uses the
# baked surface exactly when the runner carries the nddev image marker
# (/etc/nddev/image-build.json) with the tool present -- so hosted runners
# keep downloading, byte for byte as before.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Linux X64 runner label; other platforms are rejected by the runner-contract guard.'
        type: string
        default: 'ubuntu-latest'
      tool_source:
        description: "Where tool binaries come from: auto (baked when the nddev image marker and tool are present, else download), image (require the baked tool), or download (pinned checksum-verified tarball)."
        type: string
        default: 'auto'
      actionlint_version:
        type: string
        default: '1.7.12'
      actionlint_sha256:
        description: 'SHA256 of actionlint_<ver>_linux_amd64.tar.gz from upstream checksums.txt.'
        type: string
        default: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
      post_command:
        description: 'Optional extra static check after actionlint, e.g. a repository-local pin validator.'
        type: string
        default: ''
      enable_shellcheck:
        description: 'When true, also downloads (checksum-verified) and runs shellcheck on shell scripts after actionlint.'
        type: boolean
        default: false
      shellcheck_version:
        description: 'shellcheck release version to download (without a leading v).'
        type: string
        default: '0.11.0'
      shellcheck_sha256:
        description: 'SHA256 of shellcheck-v<shellcheck_version>.linux.x86_64.tar.xz from the upstream checksums. Required when enable_shellcheck is true.'
        type: string
        default: ''

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate runner contract
        shell: bash
        env:
          ACTIONLINT_RUNNER_OS: ${{ runner.os }}
          ACTIONLINT_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 -I <<'PY'
          import os
          import sys

          def fail(message):
              print(f"actionlint runner contract: {message}", file=sys.stderr)
              raise SystemExit(1)

          if os.environ["ACTIONLINT_RUNNER_OS"] != "Linux":
              fail(
                  "this workflow downloads the linux_amd64 actionlint binary; "
                  "the runner must be Linux X64"
              )
          if os.environ["ACTIONLINT_RUNNER_ARCH"] != "X64":
              fail(
                  "the pinned actionlint_sha256 covers the linux_amd64 tarball "
                  "only; the runner must be Linux X64"
              )
          print("runner contract validated: Linux X64")
          PY

      - name: Resolve tool source
        shell: bash
        env:
          TOOL_SOURCE: ${{ inputs.tool_source }}
          ENABLE_SHELLCHECK: ${{ inputs.enable_shellcheck }}
        run: |
          set -euo pipefail
          case "$TOOL_SOURCE" in auto|image|download) ;; *)
            echo "tool_source must be auto, image or download; got '$TOOL_SOURCE'" >&2
            exit 1
          ;; esac
          resolve() {
            local tool="$1"
            case "$TOOL_SOURCE" in
              download) echo download ;;
              image)
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "tool_source=image but $tool is not on the runner" >&2
                  return 1
                fi
                echo image
                ;;
              auto)
                if [ -f /etc/nddev/image-build.json ] && command -v "$tool" >/dev/null 2>&1; then
                  echo image
                else
                  echo download
                fi
                ;;
            esac
          }
          actionlint_source="$(resolve actionlint)"
          printf 'TOOL_SOURCE_ACTIONLINT=%s\n' "$actionlint_source" >> "$GITHUB_ENV"
          echo "actionlint source: $actionlint_source"
          if [ "$ENABLE_SHELLCHECK" = "true" ]; then
            shellcheck_source="$(resolve shellcheck)"
            printf 'TOOL_SOURCE_SHELLCHECK=%s\n' "$shellcheck_source" >> "$GITHUB_ENV"
            echo "shellcheck source: $shellcheck_source"
          fi

      - name: Isolate global Git config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          isolated_config="$RUNNER_TEMP/nddev-ci-global.gitconfig"
          : > "$isolated_config"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$isolated_config" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Use baked actionlint
        if: ${{ env.TOOL_SOURCE_ACTIONLINT == 'image' }}
        run: |
          set -euo pipefail
          # The image build chain attests this binary (manifest binary_sha256,
          # estate audit); the job reports what it used rather than re-pinning.
          binary="$(command -v actionlint)"
          echo "using baked actionlint at $binary"
          sha256sum "$binary"
          actionlint --version

      - name: Download actionlint (pinned + checksum-verified)
        if: ${{ env.TOOL_SOURCE_ACTIONLINT == 'download' }}
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint_version }}
          ACTIONLINT_SHA256: ${{ inputs.actionlint_sha256 }}
        run: |
          set -euo pipefail
          # --retry covers only the transient case: 5xx, connection failures and
          # timeouts. It does not retry a 404 and it cannot weaken what follows,
          # because the checksum below is verified either way. Without it a GitHub
          # Releases 503 fails a required gate outright, which happened on 2026-08-12.
          #
          # No --retry-delay on purpose. Setting it makes every attempt wait the same
          # fixed interval and DISABLES curl's exponential backoff; the first version
          # here used `--retry 3 --retry-delay 2` and burned all four attempts inside
          # six seconds, which a Releases outage outlasts easily. Left unset, curl backs
          # off 1s, 2s, 4s, 8s..., and --retry-max-time bounds the whole thing so a
          # genuinely dead endpoint still fails the job rather than hanging it.
          curl -fsSL --retry 2 --retry-max-time 120 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # Install into a runner-writable directory rather than /usr/local/bin:
          # GitHub-hosted runners let the job user write there, self-hosted ones
          # normally do not, and a correctly isolated self-hosted runner must not.
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 /tmp/actionlint "${RUNNER_TEMP}/bin/actionlint"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/actionlint" --version

      - name: Run actionlint
        run: actionlint -color

      - name: Use baked shellcheck
        if: ${{ inputs.enable_shellcheck && env.TOOL_SOURCE_SHELLCHECK == 'image' }}
        run: |
          set -euo pipefail
          # The baked shellcheck is the image's apt surface; its version can
          # trail the download pin, so it is reported here where the log and
          # the lint verdict sit together. A consumer that needs the exact
          # pinned release selects tool_source: download.
          binary="$(command -v shellcheck)"
          echo "using baked shellcheck at $binary"
          sha256sum "$binary"
          shellcheck --version

      - name: Download shellcheck (pinned + checksum-verified)
        if: ${{ inputs.enable_shellcheck && env.TOOL_SOURCE_SHELLCHECK == 'download' }}
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck_version }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$SHELLCHECK_SHA256" ]; then
            echo "enable_shellcheck is true but shellcheck_sha256 is empty; a SHA256 of shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz is required" >&2
            exit 1
          fi
          curl -fsSL --retry 2 --retry-max-time 120 -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # Install into a runner-writable directory (consistent with the
          # actionlint binary above): GitHub-hosted runners let the job user
          # write there, correctly isolated self-hosted runners must not need to.
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/shellcheck" --version

      - name: Run shellcheck
        if: ${{ inputs.enable_shellcheck }}
        run: |
          set -euo pipefail
          # Recursive: glob every shell script under the checkout. `mapfile`
          # tolerates spaces/quotes in paths; `git grep` scopes to tracked
          # files only, which avoids scanning vendored/ignored noise.
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            mapfile -t scripts < <(git grep -Il '' -- '*.sh')
          else
            mapfile -t scripts < <(find . -type f -name '*.sh')
          fi
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts found; nothing to check"
            exit 0
          fi
          shellcheck --check-sourced --external-sources "${scripts[@]}"

      - name: Run post-actionlint command
        if: ${{ inputs.post_command != '' }}
        env:
          POST_COMMAND: ${{ inputs.post_command }}
        run: bash -euo pipefail -c "$POST_COMMAND"
