# Operator mapping for NDDev private repositories. This is estate-specific data,
# not a reusable-workflow default. Compile it before dispatch; GitHub will not
# fall back after a self-hosted label has entered the queue.
schema: nddev-ci-runner-map/v1
fleet_contract:
  repository: NDDev-OpenNetwork/github-actions
  minimum_contract_version: 2
  worker_kind: incus-container
  ephemeral: true
  jobs_per_worker: 1
  executed_worker_disposition: destroy
routes:
  linux:
    hosted:
      runner: ubuntu-latest
      backend: github-hosted-standard
      capabilities: [container-runtime]
    fast:
      runner: nddev-linux-fast
      backend: self-hosted
      capabilities: []
    standard:
      runner: nddev-linux-standard
      backend: self-hosted
      capabilities: []
    integration:
      runner: nddev-linux-integration
      backend: self-hosted
      capabilities: [container-runtime]
  macos:
    hosted:
      runner: macos-latest
      backend: github-hosted-standard
      capabilities: []
  windows:
    hosted:
      runner: windows-latest
      backend: github-hosted-standard
      capabilities: []
