# Node.js CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: node
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  node:
    permissions: { contents: read }
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/node-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      package_manager: bun
      test_command: 'bun test'
