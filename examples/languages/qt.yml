# Qt (C++) CI caller (any tier). Replace @<sha> with a pinned full commit SHA.
name: qt
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: {}
concurrency:
  group: qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qt:
    permissions: { contents: read }
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/qt-ci.yml@<sha>
    with:
      runner: ubuntu-latest
      # Use an exact Qt release for reproducible provisioning.
      qt_version: '6.8.3'
